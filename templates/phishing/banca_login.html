<!DOCTYPE html>
<!--
  Plantilla de SIMULACIÓN de phishing (concienciación) — REDHAVOC
  Uso exclusivo en campañas autorizadas de ciberseguridad.
  Marcadores: {{ORG}} · {{TARGET_URL}} · {{FECHA}}
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ORG}} — Banca en línea (simulación)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .tarjeta { background: #fff; width: 390px; border-radius: 12px; box-shadow: 0 14px 38px rgba(0,10,20,.5); overflow: hidden; }
  .cabecera { background: #7a1f1f; color: #fff; padding: 22px; text-align: center; }
  .cabecera .logo { font-size: 24px; font-weight: 700; letter-spacing: .4px; }
  .cabecera .sub { font-size: 12px; opacity: .85; margin-top: 4px; }
  .cuerpo { padding: 26px; }
  .aviso { background: #fdecea; border: 1px solid #f5b8b0; color: #8c1d18; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: #333; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid #d5d9df; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #7a1f1f; box-shadow: 0 0 0 3px rgba(122,31,31,.12); }
  button { width: 100%; margin-top: 20px; background: #7a1f1f; color: #fff; border: 0; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; }
  button:hover { background: #661a1a; }
  .teclado { text-align: center; font-size: 11.5px; color: #666; margin-top: 12px; }
  .pie { text-align: center; font-size: 11px; color: #98a2b3; padding: 14px; border-top: 1px solid #eef1f6; }
  .track { display: none; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="cabecera">
      <div class="logo">{{ORG}} Banca</div>
      <div class="sub">Banca en línea · Acceso a tus cuentas</div>
    </div>
    <div class="cuerpo">
      <div class="aviso">🔐 Movimiento no reconocido el {{FECHA}}. Verifica tu identidad para revisar las operaciones.</div>
      <form method="POST" action="/captura">
        <label>Documento / usuario</label>
        <input type="text" name="usuario" placeholder="DNI o usuario" required>
        <label>Contraseña</label>
        <input type="password" name="contrasena" placeholder="••••••••" required>
        <button type="submit">Verificar identidad</button>
        <div class="teclado">Tu banco NUNCA pide claves por correo o teléfono.</div>
      </form>
    </div>
    <div class="pie">© {{ORG}} — Simulación de concienciación · No es un sitio bancario real</div>
  </div>
  <img class="track" src="/track.gif" alt="">
</body>
</html>
