<!DOCTYPE html>
<!--
  Plantilla de SIMULACIÓN de phishing (concienciación) — REDHAVOC
  Uso exclusivo en campañas autorizadas de ciberseguridad.
  Marcadores: {{ORG}} · {{TARGET_URL}} · {{FECHA}}
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ORG}} — Portal del empleado</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: linear-gradient(135deg, #f4f6fb 0%, #e8ecf5 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .tarjeta { background: #fff; width: 380px; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,40,80,.15); overflow: hidden; }
  .cabecera { background: #1a3a6b; color: #fff; padding: 22px; text-align: center; }
  .cabecera .logo { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .cabecera .sub { font-size: 12px; opacity: .85; margin-top: 4px; }
  .cuerpo { padding: 26px; }
  .aviso { background: #fff7e6; border: 1px solid #ffd98a; color: #8a5a00; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: #444; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid #ccd4e0; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #1a3a6b; box-shadow: 0 0 0 3px rgba(26,58,107,.12); }
  button { width: 100%; margin-top: 20px; background: #1a3a6b; color: #fff; border: 0; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; }
  button:hover { background: #16325c; }
  .pie { text-align: center; font-size: 11px; color: #98a2b3; padding: 14px; border-top: 1px solid #eef1f6; }
  /* Píxel de seguimiento de la simulación */
  .track { display: none; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="cabecera">
      <div class="logo">{{ORG}}</div>
      <div class="sub">Portal del empleado · Acceso seguro</div>
    </div>
    <div class="cuerpo">
      <div class="aviso">⚠️ Tu sesión expiró el {{FECHA}}. Vuelve a iniciar sesión para continuar.</div>
      <form method="POST" action="/captura">
        <label>Usuario corporativo</label>
        <input type="text" name="usuario" placeholder="nombre.apellido" required>
        <label>Contraseña</label>
        <input type="password" name="contrasena" placeholder="••••••••" required>
        <button type="submit">Iniciar sesión</button>
      </form>
    </div>
    <div class="pie">© {{ORG}} — Departamento de TI · Simulación de seguridad</div>
  </div>
  <img class="track" src="/track.gif" alt="">
</body>
</html>
