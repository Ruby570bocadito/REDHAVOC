<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ORG}} — Archivo compartido</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: linear-gradient(150deg, #fdfbfb 0%, #ebedee 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .tarjeta { background: #fff; width: 400px; border-radius: 12px; box-shadow: 0 10px 30px rgba(30,40,60,.16); overflow: hidden; }
  .cabecera { background: #0f6b3f; color: #fff; padding: 22px; text-align: center; }
  .cabecera .logo { font-size: 24px; font-weight: 700; }
  .cabecera .sub { font-size: 12px; opacity: .85; margin-top: 4px; }
  .cuerpo { padding: 26px; }
  .archivo { display: flex; align-items: center; gap: 12px; background: #f0f7f3; border: 1px solid #cfe5d8; border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .archivo .icono { font-size: 26px; }
  .archivo .nombre { font-size: 13.5px; font-weight: 600; color: #1c3a2b; }
  .archivo .meta { font-size: 11.5px; color: #6b8a7a; margin-top: 2px; }
  .aviso { background: #fff7e6; border: 1px solid #ffd98a; color: #8a5a00; font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #333; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid #ccd6e4; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #0f6b3f; box-shadow: 0 0 0 3px rgba(15,107,63,.12); }
  button { width: 100%; margin-top: 20px; background: #0f6b3f; color: #fff; border: 0; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; }
  button:hover { background: #0c5a34; }
  .pie { text-align: center; font-size: 11px; color: #98a2b3; padding: 14px; border-top: 1px solid #eef1f6; }
  .track { display: none; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="cabecera">
